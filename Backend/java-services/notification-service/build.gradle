plugins {
    id 'java'
    id 'application'
}

group = 'ru.docflow'
version = '1.0'
sourceCompatibility = '17'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.rabbitmq:amqp-client:5.22.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    implementation 'com.sun.mail:javax.mail:1.6.2'
}

application {
    mainClass = 'ru.docflow.notification.Main'
}

jar {
    manifest {
        attributes 'Main-Class': 'ru.docflow.notification.Main'
    }
}
