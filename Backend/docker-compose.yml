version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: docflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: docflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d docflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: docflow_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: docflow_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  minio:
    image: minio/minio:latest
    container_name: docflow_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Go-сервисы добавляются ниже после сборки
  # iam-service:
  #   build: ./go-services/iam-service
  #   ports: ["8081:8081"]
  #   depends_on: [postgres]
  #   environment:
  #     DB_DSN: postgres://iam_user:iam_pass@postgres:5432/docflow?search_path=iam_schema&sslmode=disable

  # ─── Go services ────────────────────────────────────────────────────────────

  iam-service:
    build:
      context: .
      dockerfile: Dockerfile.go-service
      args:
        SERVICE: iam-service
    container_name: docflow_iam
    restart: unless-stopped
    ports:
      - "8081:8081"
      - "9081:9081"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: docflow
      DB_USER: iam_user
      DB_PASSWORD: iam_pass
      HTTP_PORT: "8081"
      GRPC_PORT: "9081"
      ALLOWED_ORIGIN: "http://localhost"
    depends_on:
      postgres:
        condition: service_healthy

  catalog-service:
    build:
      context: .
      dockerfile: Dockerfile.go-service
      args:
        SERVICE: catalog-service
    container_name: docflow_catalog
    restart: unless-stopped
    ports:
      - "8082:8082"
      - "9082:9082"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: docflow
      DB_USER: catalog_user
      DB_PASSWORD: catalog_pass
      HTTP_PORT: "8082"
      GRPC_PORT: "9082"
      FILE_SERVICE_URL: "file-service:9091"
      ALLOWED_ORIGIN: "http://localhost"
    depends_on:
      postgres:
        condition: service_healthy

  collaboration-service:
    build:
      context: .
      dockerfile: Dockerfile.go-service
      args:
        SERVICE: collaboration-service
    container_name: docflow_collaboration
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: docflow
      DB_USER: collaboration_user
      DB_PASSWORD: collaboration_pass
      HTTP_PORT: "8083"
      AMQP_URL: "amqp://guest:guest@rabbitmq:5672/"
      ALLOWED_ORIGIN: "http://localhost"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  orchestrator-service:
    build:
      context: .
      dockerfile: Dockerfile.go-service
      args:
        SERVICE: orchestrator-service
    container_name: docflow_orchestrator
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: docflow
      DB_USER: orchestrator_user
      DB_PASSWORD: orchestrator_pass
      HTTP_PORT: "8084"
      AMQP_URL: "amqp://guest:guest@rabbitmq:5672/"
      IAM_SERVICE_URL: "iam-service:9081"
      CATALOG_SERVICE_URL: "catalog-service:9082"
      ALLOWED_ORIGIN: "http://localhost"
      METRICS_LOG_INTERVAL_SECONDS: "10"
      METRICS_CSV_DIR: "/metrics"
    volumes:
      - ./metrics:/metrics
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ─── Java services ──────────────────────────────────────────────────────────

  file-service:
    build:
      context: .
      dockerfile: Dockerfile.file-service
    container_name: docflow_file
    restart: unless-stopped
    ports:
      - "9091:9091"
    environment:
      MINIO_ENDPOINT: "http://minio:9000"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      GRPC_PORT: "9091"
    depends_on:
      minio:
        condition: service_healthy

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile.notification-service
    container_name: docflow_notification
    restart: unless-stopped
    environment:
      AMQP_URL: "amqp://guest:guest@rabbitmq:5672/%2f"
      SMTP_HOST: "${SMTP_HOST:-smtp.gmail.com}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
    depends_on:
      rabbitmq:
        condition: service_healthy

  # ─── Frontend ────────────────────────────────────────────────────────────────

  frontend:
    build:
      context: ../Frontend
      dockerfile: Dockerfile
    container_name: docflow_frontend
    restart: unless-stopped

  # ─── Caddy reverse proxy ────────────────────────────────────────────────────

  caddy:
    image: caddy:2-alpine
    container_name: docflow_caddy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - iam-service
      - catalog-service
      - collaboration-service
      - orchestrator-service
      - frontend

volumes:
  postgres_data:
  rabbitmq_data:
  minio_data:
